name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/MoonshotAI/kimi-code.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check if behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Behind upstream by $BEHIND commits"

      - name: Exit if already up to date
        if: steps.check.outputs.behind == '0'
        run: |
          echo "Already up to date with upstream. Nothing to do."
          exit 0

      - name: Attempt merge
        id: merge
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "CONFLICT=true" >> "$GITHUB_OUTPUT"

      - name: Push if clean merge
        if: steps.merge.outputs.CONFLICT != 'true'
        run: git push origin main

      - name: Create PR on conflict
        if: steps.merge.outputs.CONFLICT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          BRANCH="sync/upstream-${DATE}"
          git reset --hard origin/main
          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit || true
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync upstream ${DATE}" \
            --body "Upstream merge produced conflicts. Manual resolution is required to preserve custom changes (e.g. agents-dir feature, pathe bundling)." \
            --base main \
            --head "$BRANCH"
